{% extends 'base.html' %}
{% block title %}Iniciar Sesión - Gamificación UBE{% endblock %}

{% block contenido %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="fondo-blur" style="width: 100%; max-width: 400px; text-align: center; padding: 2.5em;">
        <h2 style="color: #a10020; margin-bottom: 1.5em; font-size: 1.8em;">🔑 Iniciar Sesión</h2>

        <form action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 1.2em;">
            <input type="email" name="email" placeholder="Correo electrónico" required 
                   style="padding: 12px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; width: 100%; box-sizing: border-box;">
            
            <input type="password" name="password" placeholder="Contraseña" required 
                   style="padding: 12px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; width: 100%; box-sizing: border-box;">
            
            <button type="submit" class="btn-comprar" style="margin-top: 0.5em; padding: 12px; font-size: 1.1em; cursor: pointer;">
                Ingresar
            </button>
        </form>

        <p style="margin-top: 2em; font-size: 0.95em; color: #666;">
            ¿No tienes una cuenta? 
            <a href="{{ url_for('registro') }}" style="color: #a10020; font-weight: bold; text-decoration: none;">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}
